name: PromoFlash v2 brand contract QA
on:
  push:
    branches:
      - 'feat/night-20261024-promoflash-brand-contract'
  pull_request:
    paths:
      - 'v2/brand-contract.mjs'
      - 'tests/brand-contract.test.mjs'
      - '.github/workflows/pf-v2-brand-contract-qa.yml'
jobs:
  brand-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: node --check v2/brand-contract.mjs && node --check tests/brand-contract.test.mjs
      - name: Isolated contract tests
        run: node --test tests/brand-contract.test.mjs
