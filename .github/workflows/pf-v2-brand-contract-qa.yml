name: PromoFlash v2 brand, product and sandbox catalog QA
on:
  push:
    branches:
      - 'feat/night-20261024-promoflash-brand-contract'
  pull_request:
    paths:
      - 'v2/brand-contract.mjs'
      - 'v2/product-contract.mjs'
      - 'v2/catalog-sandbox.mjs'
      - 'v2/catalog-export.mjs'
      - 'v2/catalog-editor-bridge.mjs'
      - 'tests/brand-contract.test.mjs'
      - 'tests/product-contract.test.mjs'
      - 'tests/catalog-sandbox.test.mjs'
      - 'tests/catalog-export.test.mjs'
      - 'tests/catalog-editor-bridge.test.mjs'
      - '.github/workflows/pf-v2-brand-contract-qa.yml'
jobs:
  brand-and-product-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check v2/brand-contract.mjs
          node --check v2/product-contract.mjs
          node --check v2/catalog-sandbox.mjs
          node --check v2/catalog-export.mjs
          node --check v2/catalog-editor-bridge.mjs
          node --check tests/brand-contract.test.mjs
          node --check tests/product-contract.test.mjs
          node --check tests/catalog-sandbox.test.mjs
          node --check tests/catalog-export.test.mjs
          node --check tests/catalog-editor-bridge.test.mjs
      - name: Isolated contract and sandbox tests
        run: node --test tests/brand-contract.test.mjs tests/product-contract.test.mjs tests/catalog-sandbox.test.mjs tests/catalog-export.test.mjs tests/catalog-editor-bridge.test.mjs
