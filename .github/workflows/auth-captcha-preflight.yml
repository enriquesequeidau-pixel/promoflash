name: Auth CAPTCHA coordination guard
on:
  push:
    paths:
      - 'auth-captcha.mjs'
      - 'tests/turnstile-preview.test.mjs'
      - 'cuenta.js'
      - 'cuenta.html'
      - '.github/workflows/auth-captcha-preflight.yml'
  pull_request:
    paths:
      - 'auth-captcha.mjs'
      - 'tests/turnstile-preview.test.mjs'
      - 'cuenta.js'
      - 'cuenta.html'
      - '.github/workflows/auth-captcha-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  captcha-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate challenge behavior under staged enforcement
        run: node --test tests/turnstile-preview.test.mjs
      - name: Verify auth and disabled Pro checkout regression
        run: python3 -m unittest discover -s tests -p 'test_auth_policy.py' -v
      - name: Validate staged CAPTCHA constraints before coordinated rollout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          shared = Path('auth-captcha.mjs').read_text('utf-8')
          app = Path('cuenta.js').read_text('utf-8')
          checks = {
            'staged required challenge is intentional': 'export const AUTH_CAPTCHA_ENABLED=true;' in shared,
            'challenge expires safely': "'expired-callback'" in shared,
            'challenge error clears token': "'error-callback'" in shared,
            'token reset after attempt': 'captcha.reset()' in app,
            'auth flow requests a challenge token': 'captcha.requiredToken()' in app,
            'central module is imported': "from './auth-captcha.mjs'" in app,
          }
          for name, ok in checks.items():
            print(f"{'PASS' if ok else 'FAIL'}: {name}")
          if not all(checks.values()):
            raise SystemExit('Auth CAPTCHA preflight failed; coordinate frontend and Supabase Auth before enabling CAPTCHA.')
          PY
