name: PromoFlash mobile layout QA
on:
  pull_request:
    paths: ['landing.css', 'index.html', 'editor.js', 'editor.html', 'tests/mobile-layout.py', '.github/workflows/mobile-layout-qa.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/mobile-layout.py
