name: Generate PromoFlash campaign artwork
on:
  push:
    branches: [marketing-assets]
    paths:
      - .github/workflows/create-campaign.yml
permissions:
  contents: write
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate three PNG campaign cards
        run: |
          python -m pip install --quiet pillow
          mkdir -p marketing/scripts marketing/assets
          python - <<'PY'
          import base64,zlib,pathlib
          pathlib.Path('marketing/scripts/generate_campaign.py').write_bytes(zlib.decompress(base64.b64decode('')))
          PY
          python marketing/scripts/generate_campaign.py
      - name: Commit artwork to marketing branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketing/assets marketing/scripts
          git diff --cached --quiet || (git commit -m "Generate PromoFlash Facebook artwork" && git push)
