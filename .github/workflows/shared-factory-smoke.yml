name: PromoFlash shared-factory live smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Verify syntax and safe split of users vs analytics
        run: |
          node --check config.js
          node --check landing.js
          node --check cuenta.js
          grep -q 'resetPasswordForEmail' cuenta.js
          grep -q 'id="resetPassword"' cuenta.html
          grep -q "supabaseUrl: 'https://nrwbnjjaqilgreqhpcov.supabase.co'" config.js
          grep -q "accountSupabaseUrl: 'https://nrwbnjjaqilgreqhpcov.supabase.co'" config.js
          grep -q 'proPaymentsEnabled: false' config.js
          grep -q 'config.accountSupabaseUrl||config.supabaseUrl' cuenta.js
      - name: Test app-specific auth policy and recovery safety
        run: python3 -m unittest discover -s tests -p 'test_auth_policy.py' -v
      - name: Simulate Pro Studio ownership and output allowlist
        run: node --test tests/test_pro_studio.cjs
      - name: Confirm app-specific Supabase CORS (no payments or signups)
        run: python3 -m unittest discover -s tests -p 'test_edge_origins.py' -v
      - name: Custom HTTPS domain routes use shared factory
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://promoflash.sequeidaulabs.com'
          for FILE in index.html editor.html cuenta.html config.js cuenta.js landing.js; do
            HTTP=$(curl --fail --silent --show-error -L --retry 4 --retry-delay 4 --max-time 45 -o "/tmp/$FILE" -w '%{http_code}' "$BASE/$FILE?factory_release=20261020")
            echo "$FILE -> HTTP $HTTP"
            test "$HTTP" = 200
          done
          grep -q "supabaseUrl: 'https://nrwbnjjaqilgreqhpcov.supabase.co'" /tmp/config.js
          grep -q "accountSupabaseUrl: 'https://nrwbnjjaqilgreqhpcov.supabase.co'" /tmp/config.js
          grep -q 'proPaymentsEnabled: false' /tmp/config.js
          grep -q 'config.accountSupabaseUrl||config.supabaseUrl' /tmp/cuenta.js
          grep -q 'id="resetPassword"' /tmp/cuenta.html
          grep -q 'id="recoveryPanel"' /tmp/cuenta.html
          grep -q 'resetPasswordForEmail' /tmp/cuenta.js
          grep -q "accountSupabaseUrl: 'https://nrwbnjjaqilgreqhpcov.supabase.co'" /tmp/config.js
          echo 'PASS: botón de recuperación y código publicados efectivamente en GitHub Pages'
          echo 'PASS: analytics and auth centralized, checkout off'
